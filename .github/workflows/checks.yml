# Runs tools/check.sh on every push and pull request, so a broken script,
# a failing test or a stale Studio installer shows up as a red X on GitHub.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned tools
        run: tools/install-dev-tools.sh
      - name: Run all checks
        run: tools/check.sh
